[project]
name = "sciencebeam-trainer-delft"
version = "0.0.0"
description = "ScienceBeam Trainer DeLFT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonpickle>=1.4.1",
]

[project.optional-dependencies]
tf = [
    "tensorflow>=2.17.1",
    "wrapt>=1.14.0",
    # provides libdevice.10.bc, needed by TensorFlow's XLA GPU JIT compiler
    # (normally pulled in via tensorflow's own `and-cuda` extra, which we don't use)
    "nvidia-cuda-nvcc-cu12>=12.3.107; sys_platform == 'linux'",
]
delft = [
    "delft>=1.0.1",
    # declared directly so [tool.uv.sources] applies: uv sources are not
    # honoured for a transitive requirement, so relying on delft's own
    # `torch==2.11.0` resolves the CUDA wheel from PyPI instead
    "torch==2.11.0",
]

[dependency-groups]
dev = [
    "flake8>=4.0.1",
    "mypy>=1.19.0",
    "pylint>=3.3.9",
    "pytest>=8.4.2",
    "pytest-watcher>=0.6.0",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.27.5",
]
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.package-data]
sciencebeam_trainer_delft = ["py.typed"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sciencebeam_trainer_delft*"]

[tool.pytest-watcher]
now = true
clear = false
delay = 0.2
runner = ".venv/bin/python"
runner_args = ["-m", "pytest"]
